server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the api container. The trailing slash on proxy_pass
  # strips the /api prefix, so /api/items reaches the API as /items.
  location /api/ {
    proxy_pass http://api:5169/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 50m;
  }

  # SPA routing: unknown paths fall through to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
